<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog</title>
<style>
  :root {
    --ivory:  #FAF9F5;
    --paper:  #FFFFFF;
    --slate:  #141413;
    --clay:   #D97757;
    --clay-d: #B85C3E;
    --oat:    #E3DACC;
    --g100:   #F0EEE6;
    --g200:   #E6E3DA;
    --g300:   #A8A69E;
    --g500:   #5C5B56;
    --g700:   #3D3D3A;
    --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--ivory);
    color: var(--slate);
    font-family: var(--sans);
    line-height: 1.72;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 0 28px 120px; }

  /* ── masthead ───────────────────── */
  header.masthead {
    padding: 72px 0 44px;
    border-bottom: 1.5px solid var(--g300);
    margin-bottom: 48px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--g500);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before {
    content: "";
    width: 22px; height: 1.5px;
    background: var(--clay);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(34px, 5vw, 52px);
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin: 0 0 10px;
  }
  h1 em { font-style: italic; color: var(--clay); }
  .intro {
    font-size: 19px;
    color: var(--g700);
    margin: 14px 0 0;
    max-width: 600px;
    line-height: 1.72;
  }

  /* ── article list ──────────────── */
  .articles {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .article-card {
    display: block;
    padding: 28px 32px;
    background: var(--paper);
    border: 1.5px solid var(--g300);
    border-radius: 12px;
    text-decoration: none;
    color: var(--slate);
    transition: border-color 180ms, box-shadow 180ms;
  }
  .article-card:hover {
    border-color: var(--clay);
    box-shadow: 0 2px 12px rgba(217, 119, 87, 0.1);
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .card-tag {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--clay);
    background: #FFF3ED;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .card-date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--g500);
  }
  .card-title {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 500;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .card-desc {
    font-size: 16px;
    color: var(--g700);
    line-height: 1.65;
  }

  /* ── footer ────────────────────── */
  footer {
    margin-top: 80px;
    border-top: 1.5px solid var(--g300);
    padding-top: 28px;
    font-size: 12px;
    color: var(--g500);
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
  }

  @media (max-width: 600px) {
    .article-card { padding: 20px; }
    .card-title { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="eyebrow">Technical Blog</div>
    <h1>Cryptography <em>Notes</em></h1>
    <p class="intro">密码学与零知识证明的学习笔记。</p>
  </header>

  <div class="articles">

    <a class="article-card" href="basefold/basefold.html">
      <div class="card-top">
        <span class="card-tag">Cryptography</span>
        <span class="card-date">2026-05</span>
      </div>
      <div class="card-title">Basefold 协议详解</div>
      <div class="card-desc">多线性多项式承诺方案 —— 通过完整数值例子，逐步走完 IOPP 承诺、Sumcheck 归约与查询验证的全过程。</div>
    </a>

    <a class="article-card" href="FRI/FRI.html">
      <div class="card-top">
        <span class="card-tag">Cryptography</span>
        <span class="card-date">2026-05</span>
      </div>
      <div class="card-title">FRI 协议详解</div>
      <div class="card-desc">Fast Reed-Solomon IOP of Proximity —— 通过一个完整的数值例子，逐步走完 FRI 协议的承诺阶段与查询阶段。</div>
    </a>

  </div>

  <footer>Cryptography Notes</footer>

</div>
</body>
</html>
